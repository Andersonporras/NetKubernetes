apiVersion: v1
kind: Service
metadata:
  name: mssql-service
  labels:
    name: mssql-service
    app: app
spec:
  # ClusterIP: la base de datos solo se consume desde dentro del cluster.
  type: ClusterIP
  selector:
    app: app
    name: mssql-pod
  ports:
    - port: 1433
      targetPort: 1433
