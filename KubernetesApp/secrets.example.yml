# Plantilla del Secret que consumen app-deploy.yml, app-pod.yml,
# sqlserver-deploy.yml y sqlserver-pod.yml.
#
# NO edites este archivo con valores reales. Copialo y aplica la copia:
#
#   cp KubernetesApp/secrets.example.yml KubernetesApp/secrets.yml
#   # reemplaza los valores y luego:
#   kubectl apply -f KubernetesApp/secrets.yml
#
# KubernetesApp/secrets.yml esta en .gitignore, asi que no se sube al repo.
# Alternativa sin archivos, directo por linea de comandos:
#
#   kubectl create secret generic netkubernetes-secrets \
#     --from-literal=sa-password='TuPassword_Fuerte123$' \
#     --from-literal=sqlserver-connection='Data Source=mssql-service;Initial Catalog=InmuebleDB;User Id=sa;Password=TuPassword_Fuerte123$;TrustServerCertificate=True' \
#     --from-literal=jwt-key='una-clave-larga-y-aleatoria-de-al-menos-32-caracteres'
apiVersion: v1
kind: Secret
metadata:
  name: netkubernetes-secrets
  labels:
    app: app
type: Opaque
stringData:
  # Contrasena del usuario sa del contenedor de SQL Server.
  # SQL Server exige 8+ caracteres con mayusculas, minusculas, numeros y simbolos.
  sa-password: "REEMPLAZAME_Password123$"

  # Cadena de conexion que usa la API. El host es el nombre del Service de
  # SQL Server (mssql-service), y la contrasena debe coincidir con sa-password.
  sqlserver-connection: "Data Source=mssql-service;Initial Catalog=InmuebleDB;User Id=sa;Password=REEMPLAZAME_Password123$;TrustServerCertificate=True"

  # Clave para firmar los JWT (HMAC-SHA512). Minimo 32 caracteres aleatorios.
  # Generar una: openssl rand -base64 48
  jwt-key: "REEMPLAZAME_clave_aleatoria_de_al_menos_32_caracteres"
