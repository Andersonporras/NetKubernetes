apiVersion: v1
kind: Pod
metadata:
  name: app-pod
  labels:
    app.kubernetes.io/name: app
    type: netapi
spec:
  containers:
    - name: app-api
      image: anderporras/net-kubernets-ander:v1.0
      ports:
        - containerPort: 5000
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      env:
        # Kestrel escucha en el 80 por defecto; lo movemos al 5000
        # para que coincida con el targetPort del Service.
        - name: ASPNETCORE_URLS
          value: http://+:5000
        - name: ConnectionStrings__SQLServerConnection
          valueFrom:
            secretKeyRef:
              name: netkubernetes-secrets
              key: sqlserver-connection
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: netkubernetes-secrets
              key: jwt-key
